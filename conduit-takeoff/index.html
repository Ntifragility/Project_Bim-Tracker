<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Conduit Takeoff Viewer — trace conduit runs on IFC models and estimate quantities" />
    <title>Conduit Takeoff</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- 3D Viewport -->
      <div id="viewer-container"></div>

      <!-- Revit-Style Ribbon host (R1: ribbon owns commands) -->
      <header id="ribbon" class="ribbon-host" data-rc-host></header>

      <!-- Loading Overlay -->
      <div id="loading-overlay" class="loading-overlay" hidden>
        <div class="loading-card">
          <div class="loading-spinner"></div>
          <p id="loading-stage" class="loading-stage">Preparing…</p>
          <div class="loading-bar-track">
            <div id="loading-bar-fill" class="loading-bar-fill"></div>
          </div>
          <p id="loading-detail" class="loading-detail"></p>
          <button id="loading-cancel" class="btn btn-ghost" type="button">Cancel</button>
        </div>
      </div>

      <!-- Revit-Style Lateral Dock (Properties Palette & Project Browser) -->
      <aside id="sidebar" class="rc-lateral-dock dock" data-rc-host>
        <button id="sidebar-toggle" class="rc-dock-toggle sidebar-toggle" title="Toggle Dock" aria-label="Toggle Lateral Dock" type="button">
          <span>◀</span>
        </button>

        <!-- Dock Panes (Properties, Browser, Schedules) -->
        <div class="rc-dock-panels">
          <!-- Properties Palette Host -->
          <div id="dock-properties-container" class="rc-dock-pane active"></div>

          <!-- Project Browser Host -->
          <div id="dock-browser-container" class="rc-dock-pane" style="display: none;"></div>

          <!-- Schedules / Quantities Pane -->
          <div id="dock-schedules-container" class="rc-dock-pane" style="display: none;">
            <div class="rc-schedule-header">
              <span class="rc-schedule-title">Schedules &amp; Quantities</span>
              <div class="rc-schedule-subtabs">
                <button id="btn-sched-runs" class="rc-sched-subtab active" type="button">Run List</button>
                <button id="btn-sched-bom" class="rc-sched-subtab" type="button">BOM Schedule</button>
              </div>
            </div>

            <!-- Run List View -->
            <div id="rc-sched-runs-view" class="rc-sched-view active">
              <div class="run-list-header">
                <h4>Conduit Run List</h4>
                <span id="runs-count-badge" class="badge">0</span>
              </div>
              <div id="run-list" class="run-list">
                <p class="text-muted">No runs drawn yet. Click on the 3D model to begin tracing.</p>
              </div>
            </div>

            <!-- Contractor BOM View -->
            <div id="rc-sched-bom-view" class="rc-sched-view" style="display: none;">
              <div class="summary-settings-bar">
                <label for="waste-factor-input" class="summary-label">Waste %:
                  <input id="waste-factor-input" type="number" min="0" max="100" value="0" class="input-number" />
                </label>
                <span class="stick-spec-badge">Stick: 10 ft (3.048 m)</span>
              </div>
              <h4>Contractor BOM Schedule</h4>
              <div id="summary-table-container">
                <p class="text-muted">Draw runs to see the summary.</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Authentic Revit Dock Bottom Tabs -->
        <nav class="rc-dock-tabs" role="tablist" aria-label="Dock Navigation">
          <button id="tab-dock-properties" class="rc-dock-tab active" data-dock-tab="properties" type="button" role="tab" aria-selected="true">
            Properties
          </button>
          <button id="tab-dock-browser" class="rc-dock-tab" data-dock-tab="browser" type="button" role="tab" aria-selected="false">
            Project Browser
          </button>
          <button id="tab-dock-schedules" class="rc-dock-tab" data-dock-tab="schedules" type="button" role="tab" aria-selected="false">
            Schedules
          </button>
        </nav>

        <!-- Hidden backward-compatibility elements so collectEls() keeps resolving smoothly -->
        <div id="legacy-controls" hidden style="display: none;" aria-hidden="true">
          <button class="sidebar-tab-btn" data-tab-target="model" type="button"></button>
          <button class="sidebar-tab-btn" data-tab-target="draw" type="button"></button>
          <button class="sidebar-tab-btn" data-tab-target="summary" type="button"></button>

          <section class="control-group" data-sidebar-panel="model">
            <button id="btn-open-ifc" type="button"></button>
            <input id="file-input" type="file" accept=".ifc" />
            <div id="model-info" hidden>
              <span id="model-name">—</span>
              <span id="model-size">—</span>
              <span id="model-unit">—</span>
              <span id="model-schema">—</span>
            </div>
            <button id="btn-fit-view" type="button"></button>
            <button id="btn-view-top" type="button"></button>
            <button id="btn-view-front" type="button"></button>
            <button id="btn-view-right" type="button"></button>
          </section>

          <section class="control-group" data-sidebar-panel="draw">
            <button id="btn-draw-mode" type="button"></button>
            <button id="btn-ortho" type="button"></button>
            <button id="btn-perp" type="button"></button>
            <button id="btn-undo" type="button"></button>
            <button id="btn-redo" type="button"></button>
            <div id="diameter-list"></div>
            <div id="active-run-info" hidden>
              <span id="run-length">0.000</span>
              <span id="run-sticks">0</span>
              <span id="run-segments">0</span>
            </div>
            <div id="active-run-actions" hidden>
              <button id="btn-finish-run" type="button"></button>
              <button id="btn-cancel-run" type="button"></button>
            </div>
            <div id="vertical-step-controls" hidden>
              <input id="input-vertical-len" type="number" step="0.5" value="2.0" />
              <button id="btn-add-vert-up" type="button"></button>
              <button id="btn-add-vert-down" type="button"></button>
            </div>
          </section>

          <section class="control-group" data-sidebar-panel="summary"></section>

          <input id="project-file-input" type="file" accept=".json,.conduit.json" />
          <button id="btn-load-project" type="button"></button>
          <button id="btn-save" type="button"></button>
          <button id="btn-export-csv" type="button"></button>
          <button id="btn-export-ifc" type="button"></button>
        </div>
      </aside>

      <!-- Status Bar is managed by ribbon-chrome (rc-status-bar) -->
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
