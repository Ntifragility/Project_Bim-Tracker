name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  viewport-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Pure cdylib with a C API: plain cargo emits a directly instantiable
      # module, no wasm-pack needed. Guards against regressions of the missing
      # `viewport_core.wasm` that broke the conduit open-file button.
      - run: node scripts/build-viewport-wasm.mjs
      - run: node -e "const b=require('node:fs').readFileSync('public/assets/viewport_core.wasm'); if(b[0]!==0x00||b[1]!==0x61||b[2]!==0x73||b[3]!==0x6d) throw new Error('not a wasm module')"

  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:conduit

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          curl -sL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /tmp
          mkdir -p ~/.cargo/bin
          cp /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack ~/.cargo/bin/wasm-pack
          chmod +x ~/.cargo/bin/wasm-pack
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: wasm-pack build bindings/conduit-wasm --target bundler
      - run: wasm-pack build bindings/tray-wasm --target bundler
      - run: python3 scripts/check-boundaries.py
