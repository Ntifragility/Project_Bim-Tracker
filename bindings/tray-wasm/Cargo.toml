[package]
name = "tray-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tray-tagging = { path = "../../crates/tray-tagging" }
tray-routing = { path = "../../crates/tray-routing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"
